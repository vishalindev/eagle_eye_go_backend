syntax = "proto3";

package eagleeye.notification.v1;

option go_package = "example.com/eagle-eye/api/protobuf/notification/v1;notificationv1";

service NotificationService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}
