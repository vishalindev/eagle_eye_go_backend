syntax = "proto3";

package eagleeye.camera.v1;

option go_package = "example.com/eagle-eye/api/protobuf/camera/v1;camerav1";

service CameraService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}
