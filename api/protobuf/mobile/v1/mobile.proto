syntax = "proto3";

package eagleeye.mobile.v1;

option go_package = "example.com/eagle-eye/api/protobuf/mobile/v1;mobilev1";

service MobileService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}
