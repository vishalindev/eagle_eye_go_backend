syntax = "proto3";

package eagleeye.dashboard.v1;

option go_package = "example.com/eagle-eye/api/protobuf/dashboard/v1;dashboardv1";

service DashboardService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}
