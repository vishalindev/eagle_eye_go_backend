syntax = "proto3";

package eagleeye.identity.v1;

option go_package = "example.com/eagle-eye/api/protobuf/identity/v1;identityv1";

service IdentityService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}
